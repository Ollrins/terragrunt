---
- name: Подготовка всех узлов Kubernetes
  hosts: all
  become: yes
  vars:
    kubernetes_version: "1.29"

  tasks:
    - name: Ожидаем доступности SSH
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Отключаем swap временно
      command: swapoff -a
      changed_when: false

    - name: Отключаем swap навсегда
      lineinfile:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        state: absent

    - name: Загружаем модули ядра
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    - name: Настраиваем sysctl
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: 1 }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: 1 }
        - { key: net.ipv4.ip_forward, value: 1 }

    - name: Добавляем репозиторий Docker
      command: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Устанавливаем containerd
      dnf:
        name: containerd.io
        state: present

    - name: Настраиваем containerd
      copy:
        dest: /etc/containerd/config.toml
        content: |
          version = 2
          [plugins."io.containerd.grpc.v1.cri"]
            [plugins."io.containerd.grpc.v1.cri".containerd]
              [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                runtime_type = "io.containerd.runc.v2"
                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
                  SystemdCgroup = true
      notify: restart containerd

    - name: Запускаем containerd
      systemd:
        name: containerd
        state: started
        enabled: yes

    - name: Добавляем репозиторий Kubernetes
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/repodata/repomd.xml.key

    - name: Устанавливаем компоненты Kubernetes
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_gpg_check: yes

    - name: Включаем kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

  handlers:
    - name: restart containerd
      systemd:
        name: containerd
        state: restarted

- name: Инициализация Master
  hosts: masters
  become: yes
  tasks:
    - name: kubeadm init
      command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --service-cidr=10.96.0.0/12
        --kubernetes-version=v1.29.0
        --cri-socket=unix:///run/containerd/containerd.sock
      args:
        creates: /etc/kubernetes/admin.conf

    - name: .kube для root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: admin.conf
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0600'

    - name: Flannel CNI
      command: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /root/.kube/config

    - name: join-команда
      command: kubeadm token create --print-join-command
      register: join_command_result

- name: Присоединение Worker
  hosts: workers
  become: yes
  tasks:
    - name: kubeadm join
      command: "{{ hostvars['master'].join_command_result.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Ingress + Monitoring
  hosts: masters
  become: yes
  vars:
    kubeconfig_path: /root/.kube/config
    helm_path: /usr/local/bin/helm

  tasks:
    - name: git
      dnf: { name: git, state: present }

    - name: Helm archive
      get_url:
        url: https://get.helm.sh/helm-v3.15.2-linux-amd64.tar.gz
        dest: /tmp/helm.tar.gz

    - name: unpack helm
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: yes

    - name: helm bin
      copy:
        src: /tmp/linux-amd64/helm
        dest: "{{ helm_path }}"
        mode: '0755'
        remote_src: yes

    - name: pip3
      dnf: { name: python3-pip, state: present }

    - name: upgrade oauthlib
      command: python3 -m pip install --upgrade oauthlib requests_oauthlib

    - name: kubernetes lib
      command: python3 -m pip install --upgrade kubernetes

    - name: helm repo ingress-nginx
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx
        binary_path: "{{ helm_path }}"
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }

    - name: install ingress-nginx
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        binary_path: "{{ helm_path }}"
        values:
          controller:
            hostNetwork: true
            hostPort: { enabled: true, ports: { http: 80, https: 443 } }
            kind: DaemonSet
            service: { type: ClusterIP }
            ingressClassResource: { default: true }
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }

    - name: toleration control-plane
      command: >
        {{ helm_path }} upgrade ingress-nginx ingress-nginx/ingress-nginx
        --namespace ingress-nginx --reuse-values
        --set controller.tolerations[0].key=node-role.kubernetes.io/control-plane
        --set controller.tolerations[0].operator=Exists
        --set controller.tolerations[0].effect=NoSchedule
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }

    - name: clone kube-prometheus
      git:
        repo: 'https://github.com/prometheus-operator/kube-prometheus.git'
        dest: /root/kube-prometheus
        version: release-0.13
        force: yes

    - name: CRD
      command: kubectl apply --server-side -f /root/kube-prometheus/manifests/setup/
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }

    - name: wait CRD
      pause: { seconds: 15 }

    - name: manifests
      command: kubectl apply -f /root/kube-prometheus/manifests/
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }

    - name: grafana ingress
      command: kubectl apply -f -
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
      args:
        stdin: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: grafana-ingress
            namespace: monitoring
            annotations:
              nginx.ingress.kubernetes.io/rewrite-target: /
          spec:
            ingressClassName: nginx
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: grafana
                      port: { number: 3000 }

- name: Настройка kubectl для пользователя
  hosts: masters
  become: yes
  tasks:
    - name: Создаём директорию .kube
      file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Копируем admin.conf
      copy:
        src: /root/.kube/config
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

- name: Настройка nginx для отчёта Terragrunt на мастере
  hosts: masters
  become: yes
  tasks:
    - name: Устанавливаем nginx
      dnf:
        name: nginx
        state: present

    - name: Перезаписываем основной nginx.conf, убирая дефолтный listener на 80 порту (чтобы не конфликтовать с k8s ingress)
      copy:
        dest: /etc/nginx/nginx.conf
        content: |
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;
              sendfile        on;
              keepalive_timeout  65;
              include /etc/nginx/conf.d/*.conf;
          }
      notify: reload nginx

    - name: Создаём директорию для отчёта
      file:
        path: /usr/share/nginx/html/terragrunt-report
        state: directory
        mode: '0755'

    - name: Копируем конфиг nginx для отчёта (исправленный root и location)
      copy:
        dest: /etc/nginx/conf.d/terragrunt-report.conf
        content: |
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              
              location /terragrunt-report/ {
                  alias /usr/share/nginx/html/terragrunt-report/;
                  index index.html;
                  try_files $uri $uri/ /terragrunt-report/index.html =404;
              }
          }
      notify: reload nginx

    - name: Гарантированный перезапуск nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
